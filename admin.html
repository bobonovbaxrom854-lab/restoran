<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"><style>.wrap{padding:18px 5%}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{border:1px solid var(--bd);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer}.nav .on{background:var(--ac);color:#fff}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.st div,.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.st b{display:block;font-size:1.5rem;color:var(--ac)}.box{margin-bottom:10px}.ar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ar img{width:50px;height:50px;border-radius:8px;object-fit:cover}.ar .f{flex:1;min-width:140px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.ck{display:flex;gap:6px;align-items:center}.ck input{width:auto;margin:0}#lg{max-width:340px;margin:12vh auto;padding:20px}</style></head><body>
